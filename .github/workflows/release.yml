name: Release

# Every push to main builds the app for each platform, kept as workflow artifacts. A v* tag also
# publishes them as a GitHub release, under the names the homepage's download links expect.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - packaging/**
      - crates/slouch-app/examples/icon.rs
      - crates/slouch-app/src/icon_file.rs
      - .github/workflows/release.yml
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the AppImage runs on distributions with older glibc.
          - name: Linux
            os: ubuntu-22.04
            package: packaging/linux/appimage.sh
            files: target/release/slouchup-linux.AppImage
          - name: Mac
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            package: packaging/macos/bundle.sh
            files: target/release/slouchup-mac.dmg
          - name: Windows
            os: windows-latest
            package: pwsh -File packaging/windows/setup.ps1
            # The installer, and what installed copies update from.
            files: |
              target/release/velopack/slouchup-setup.exe
              target/release/velopack/*.nupkg
              target/release/velopack/releases.win.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev libxdo-dev libsoup-3.0-dev libclang-dev
          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          curl -sSLf -o "$tools/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSLf -o "$tools/linuxdeploy-plugin-appimage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          curl -sSLf -o "$tools/linuxdeploy-plugin-gtk.sh" \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x "$tools"/*
          echo "$tools" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-dotnet@v5
        if: runner.os == 'Windows'
        with:
          dotnet-version: 8.0.x

      # vpk builds the Windows installer, at the version of the velopack crate the app uses.
      - name: Install vpk
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = ((cargo pkgid velopack) -split "[#@]")[-1]
          dotnet tool install --global vpk --version $version
          "$HOME\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Package
        shell: bash
        run: ${{ matrix.package }}
        env:
          # For the Windows packaging, which reads the latest release to make an update from.
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "slouchup $GITHUB_REF_NAME" --generate-notes
