[package]
name = "slouchup"
version = "0.0.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
camera-drift = { version = "0.0.4", path = "../camera-drift" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5"
dioxus = { version = "0.7.10", features = ["desktop"] }
dioxus-cameras = "0.3.2"
dirs = "6"
futures-channel = "0.3"
futures-timer = "3"
futures-util = "0.3"
notify-rust = "4.18"
posture = { version = "0.0.4", path = "../posture" }
resvg = "0.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1"
yunet = { version = "0.0.4", path = "../yunet" }

[build-dependencies]
ico = "0.5"
resvg = { version = "0.45", default-features = false }
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"

# The release workflow installs vpk, which builds the Windows installer and the AppImage, at the
# version locked for this.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
velopack = "1.2.161"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[dev-dependencies]
ico = "0.5"
