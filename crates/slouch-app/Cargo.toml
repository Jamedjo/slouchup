[package]
name = "slouch"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
camera-drift = { version = "0.1.0", path = "../camera-drift" }
crossbeam-channel = "0.5"
dioxus = { version = "0.7.10", features = ["desktop"] }
dioxus-cameras = "0.3.2"
dirs = "6"
futures-channel = "0.3"
futures-timer = "3"
futures-util = "0.3"
notify-rust = "4.18"
posture = { version = "0.1.0", path = "../posture" }
resvg = "0.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1"
yunet = { version = "0.1.0", path = "../yunet" }
