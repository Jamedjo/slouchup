[package]
name = "slouchup"
version = "0.0.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
camera-drift = { version = "0.0.5", path = "../camera-drift" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5"
dioxus = { version = "0.7.10", features = ["desktop"] }
dioxus-cameras = "0.3.2"
dirs = "6"
futures-channel = "0.3"
futures-timer = "3"
futures-util = "0.3"
notify-rust = "4.18"
posture = { version = "0.0.5", path = "../posture" }
resvg = "0.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1"
# Newer than dioxus-desktop's, for clicks on Linux panels through ksni.
tray-icon = { version = "0.26", default-features = false }
tray-popover-tao = { version = "0.0.5", path = "../tray-popover-tao" }
yunet = { version = "0.0.5", path = "../yunet" }

[build-dependencies]
ico = "0.5"
resvg = { version = "0.45", default-features = false }
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

# The release workflow installs vpk, which builds the Windows installer and the AppImage, at the
# version locked for this.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
velopack = "1.2.161"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSButton", "NSControl", "NSResponder", "NSScreen", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[dev-dependencies]
ico = "0.5"
