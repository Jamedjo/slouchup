[package]
name = "tray-popover-tao"
version = "0.0.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A tray popover in a tao window: borderless, above everything, and hidden when it loses the focus"

[dependencies]
# The tao that dioxus-desktop builds its windows with, so its windows can be handed over.
tao = { version = "0.34.8", default-features = false }
tray-popover = { version = "0.0.4", path = "../tray-popover" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSPanel", "NSResponder", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSString", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }
